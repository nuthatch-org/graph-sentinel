name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/nuthatch-org/graph-sentinel

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # A manual run on a branch gets only a sha tag, so it never moves :latest.
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The binaries are copied out of the image just pushed, so they are the same bytes it runs.
  binaries:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract binaries
        env:
          REF: ${{ env.IMAGE }}@${{ needs.image.outputs.digest }}
        run: |
          mkdir dist
          for pair in amd64:x86_64 arm64:aarch64; do
            arch=${pair%%:*} triple=${pair##*:}-unknown-linux-musl
            id=$(docker create --platform "linux/$arch" "$REF")
            docker cp "$id:/usr/local/bin/graph-sentinel" "dist/graph-sentinel"
            docker rm "$id"
            tar -C dist -czf "dist/graph-sentinel-$GITHUB_REF_NAME-$triple.tar.gz" graph-sentinel
            rm dist/graph-sentinel
          done
          cd dist && sha256sum -- *.tar.gz > SHA256SUMS
      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
