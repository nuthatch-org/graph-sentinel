# A whole simulated indexer stack for demos and end-to-end tests. Break it with ./incident.sh.
name: graph-sentinel-demo
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: pw
      POSTGRES_DB: indexer
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro   # indexer-rs's real TAP migrations
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  sim:
    build: ./sim
    environment:
      PG_URL: postgres://postgres:pw@postgres:5432/indexer
    ports:
      - "127.0.0.1:8080:8080"   # incidents: POST /control/<name>
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/control')"]
      interval: 2s
      retries: 30

  sentinel:
    build: ..
    volumes:
      - ./graph-sentinel.toml:/etc/graph-sentinel/graph-sentinel.toml:ro
      - ./indexer-rs.toml:/etc/graph-sentinel/indexer-rs.toml:ro
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    ports:
      - "127.0.0.1:9477:9477"
    depends_on:
      sim:
        condition: service_healthy
