# yatr - https://github.com/cargopete/yatr
#
# The ci job in .github/workflows/ci.yml calls fmt-check, lint and test by
# name, so `yatr ci` locally is the same gate. release.yml is left alone.

[env]
CARGO_TERM_COLOR = "always"

[settings]
cache = true

[tasks.fmt]
desc = "Format the tree"
run = ["cargo fmt --all"]
no_cache = true

[tasks.fmt-check]
desc = "Fail if the tree is unformatted (CI: rustfmt)"
run = ["cargo fmt --all --check"]
sources = ["**/*.rs"]

[tasks.lint]
desc = "Clippy with warnings denied (CI: clippy)"
run = ["cargo clippy --all-targets -- -D warnings"]
sources = ["**/*.rs", "**/Cargo.toml", "Cargo.lock", "crates/graph-sentinel/assets/**"]

[tasks.test]
desc = "Run the test suite (CI: test)"
run = ["cargo test --all"]
sources = ["**/*.rs", "**/Cargo.toml", "Cargo.lock", "crates/graph-sentinel/assets/**"]
watch = ["**/*.rs"]

[tasks.build]
desc = "Release build of the graph-sentinel binary"
run = ["cargo build --release -p graph-sentinel"]
sources = ["**/*.rs", "**/Cargo.toml", "Cargo.lock", "crates/graph-sentinel/assets/**"]

[tasks.helm-lint]
desc = "Lint the Helm chart"
run = ["helm lint deploy/helm/graph-sentinel"]
sources = ["deploy/helm/**"]

[tasks.image]
desc = "Build the container image locally (no push)"
run = ["docker build -t graph-sentinel:dev ."]
no_cache = true

[tasks.ci]
desc = "What the CI test job runs: fmt-check, lint, test"
depends = ["fmt-check", "lint", "test"]
run = []
