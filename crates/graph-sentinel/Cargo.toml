[package]
name = "graph-sentinel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
humantime-serde = "1.1.1"
sentinel-checks = { version = "0.1.0", path = "../sentinel-checks" }
sentinel-sources = { version = "0.1.0", path = "../sentinel-sources" }
sentinel-types = { version = "0.1.0", path = "../sentinel-types" }
prometheus-client = "0.25.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "migrate"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
figment = { version = "0.10.19", features = ["test", "toml", "env"] }
